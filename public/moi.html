<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon profil Vibe-dev</title>
<meta name="description" content="Créez et gérez votre fiche de vibe-dev : pseudo, spécialités, contacts et jusqu'à 4 projets.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<style>
main { max-width: 820px; margin: 0 auto; padding: 0 16px 40px; }
.page-head { display: flex; gap: 16px; align-items: center; margin: 40px 0 20px; flex-wrap: wrap; }
.page-head h1 { font-size: clamp(28px, 5vw, 40px); margin: 0; text-align: left; }
.proj { border: 1px dashed var(--border-strong); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
.proj-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.proj-head strong { flex: 1; }
.tools-pick { max-height: 180px; overflow: auto; border: 1px solid var(--border); border-radius: 12px; padding: 8px; }
.tools-pick .chip { margin: 3px; font-size: 12px; padding: 4px 10px; }
.bonus { opacity: .7; border-style: dotted; text-align: center; color: var(--muted); }
.save-bar { position: sticky; bottom: 12px; display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
.save-bar .btn { box-shadow: 0 10px 30px -10px rgba(0,0,0,.35); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td, th { padding: 8px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
.login-box { text-align: center; padding: 60px 20px; }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<main id="app"><p class="muted" style="margin-top:40px">Chargement…</p></main>

<script type="module">
import { $, esc, api, loadMe, loginUrl, avatarHTML, renderNav, renderFooter, toast, NETWORKS, GH_ICON } from "/assets/app.js";
import { TOOLS } from "/assets/tools.js";

renderNav("/moi");
renderFooter();
const app = $("#app");

const CONTACT_HINTS = {
  telegram: "@pseudo ou t.me/pseudo",
  signal: "Lien de nom d'utilisateur : Signal → Profil → Nom d'utilisateur → Lien (signal.me/#eu/…)",
  whatsapp: "Lien QR : WhatsApp → Réglages → icône QR → Partager (wa.me/qr/…). Jamais wa.me/numéro.",
  x: "@pseudo",
  instagram: "@pseudo",
  linkedin: "linkedin.com/in/… (attention : contient souvent votre vrai nom)",
  website: "https://…",
};

function showError(form, err) {
  form.querySelectorAll(".invalid").forEach((el) => el.classList.remove("invalid"));
  form.querySelectorAll(".err").forEach((el) => el.remove());
  const key = err.field ? err.field.replace(/\./g, "-") : null;
  const target = key && form.querySelector(`[data-field="${key}"]`);
  if (target) {
    target.classList.add("invalid");
    target.insertAdjacentHTML("beforeend", `<div class="err">${esc(err.message)}</div>`);
    target.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  toast(err.message);
}

// ───────── Pas connecté ─────────
function renderLogin() {
  app.innerHTML = `<div class="panel login-box" style="margin-top:48px">
    <h1 style="font-size:clamp(28px,5vw,42px)">Rejoindre le <span class="serif grad">showroom</span></h1>
    <p class="lead">Connectez-vous avec GitHub pour créer votre fiche de vibe-dev. Nous ne recevons ni votre email ni votre nom : seulement un identifiant technique.</p>
    <p style="margin-top:24px"><a class="btn btn-dark" href="${loginUrl("/moi")}">${GH_ICON} Se connecter avec GitHub</a></p>
    <p class="faint" style="margin-top:16px">En vous inscrivant, vous acceptez la <a href="/charte">charte</a> et les <a href="/cgu">conditions d'utilisation</a>.</p>
  </div>`;
}

// ───────── Première connexion : pseudo + engagements ─────────
function renderOnboarding(user) {
  app.innerHTML = `<div class="page-head"><h1>Bienvenue 👋</h1></div>
  <form class="panel" id="onb">
    <p class="muted" style="margin-top:0">Choisissez votre <b>pseudo</b>. C'est la seule identité visible sur la plateforme, avec votre identifiant membre <span class="code">${esc(user.code)}</span>.</p>
    <label class="field" data-field="pseudo"><span>Pseudo</span>
      <input type="text" name="pseudo" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_\\-]{3,24}" value="${esc(user.pseudo || "")}" autocomplete="off">
      <small>3 à 24 caractères : lettres, chiffres, _ ou -. Évitez votre vrai nom.</small></label>
    <div class="notice notice-info" style="margin:8px 0 14px">🔒 Ici, on n'affiche jamais de nom, d'email ni de numéro. Uniquement des pseudos.</div>
    <label class="check" data-field="acceptTerms"><input type="checkbox" name="acceptTerms" required>
      <span>J'ai lu et j'accepte la <a href="/charte" target="_blank">charte déontologique</a> et les <a href="/cgu" target="_blank">conditions d'utilisation</a>.</span></label>
    <label class="check" data-field="adult"><input type="checkbox" name="adult" required><span>J'ai 18 ans ou plus.</span></label>
    <div class="links" style="margin-top:16px;display:flex;gap:10px"><button class="btn btn-primary" type="submit">Créer ma fiche</button></div>
  </form>`;
  $("#onb").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.currentTarget;
    try {
      await api("/api/me/onboarding", { method: "POST", body: { pseudo: f.pseudo.value, acceptTerms: f.acceptTerms.checked, adult: f.adult.checked } });
      location.reload();
    } catch (err) { showError(f, err); }
  });
}

// ───────── Ma fiche ─────────
function projectBlock(p, i) {
  const selected = new Set(p.tools || []);
  return `<div class="proj" data-proj>
    <div class="proj-head"><strong>Projet ${i + 1}</strong>
      <button class="btn btn-sm" type="button" data-up title="Monter">↑</button>
      <button class="btn btn-sm btn-danger" type="button" data-remove>Retirer</button></div>
    <label class="field" data-field="projects-${i}-title"><span>Nom du projet</span><input type="text" name="title" maxlength="60" value="${esc(p.title || "")}" required></label>
    <label class="field" data-field="projects-${i}-pitch"><span>Présentation courte</span><textarea name="pitch" maxlength="280" rows="2">${esc(p.pitch || "")}</textarea><small>280 caractères maximum.</small></label>
    <div class="grid-2">
      <label class="field" data-field="projects-${i}-github_url"><span>Dépôt GitHub</span><input type="url" name="github_url" placeholder="https://github.com/compte/depot" value="${esc(p.github_url || "")}"><small>La vignette est générée automatiquement depuis le dépôt.</small></label>
      <label class="field" data-field="projects-${i}-demo_url"><span>Lien de démo</span><input type="url" name="demo_url" placeholder="https://…" value="${esc(p.demo_url || "")}"></label>
    </div>
    <div class="field"><span style="font-weight:600;font-size:14px">Outils utilisés <span class="faint">(8 max)</span></span>
      <div class="tools-pick">${TOOLS.map((t) => `<button type="button" class="chip" data-tool="${esc(t.id)}" aria-pressed="${selected.has(t.id)}">${esc(t.name)}</button>`).join("")}</div></div>
  </div>`;
}

function renderProfile(user, options) {
  const contacts = user.contacts || {};
  app.innerHTML = `<div class="page-head">${avatarHTML({ code: user.code, pseudo: user.pseudo, avatar: user.avatarMode === "github" ? user.githubAvatar : null }, "avatar-lg")}
      <div><h1>${esc(user.pseudo)}</h1><span class="code">${esc(user.code)}</span></div>
      <div class="spacer"></div><a class="btn" href="/showroom#${esc(user.code)}">Voir ma fiche publique ↗</a></div>
    ${user.hidden ? `<div class="notice" style="margin-bottom:16px">⚠️ Votre fiche est actuellement masquée par la modération. Contactez l'équipe si vous pensez qu'il s'agit d'une erreur.</div>` : ""}

  <form class="panel" id="profile">
    <h2>Ma fiche</h2>
    <label class="field" data-field="pseudo"><span>Pseudo</span><input type="text" name="pseudo" maxlength="24" value="${esc(user.pseudo)}" required></label>
    <label class="field" data-field="bio"><span>Bio</span><textarea name="bio" maxlength="280" rows="3" placeholder="Ce que vous construisez, ce que vous cherchez…">${esc(user.bio)}</textarea><small>280 caractères. Pas de numéro, pas d'email.</small></label>
    <div class="field" data-field="specialties"><span style="font-weight:600;font-size:14px;display:block;margin-bottom:6px">Spécialités <span class="faint">(5 max)</span></span>
      <div class="chips" id="specs">${options.specialties.map((s) => `<button type="button" class="chip" data-spec="${esc(s)}" aria-pressed="${user.specialties.includes(s)}">${esc(s)}</button>`).join("")}</div></div>
    <label class="check"><input type="checkbox" name="available" ${user.available ? "checked" : ""}><span>🤝 Je suis disponible pour collaborer sur des projets</span></label>
    <label class="check"><input type="checkbox" name="githubAvatar" ${user.avatarMode === "github" ? "checked" : ""} ${user.githubAvatar ? "" : "disabled"}><span>Afficher mon avatar GitHub <span class="faint">(sinon, un avatar coloré est généré : rien de personnel)</span></span></label>

    <h2 style="margin-top:22px">Me contacter</h2>
    <p class="faint" style="margin-top:0">Uniquement des pseudos ou des liens d'invitation. Les liens s'ouvrent dans l'application au clic, et ne sont jamais écrits dans la page.</p>
    <div class="grid-2">${options.networks.map((n) => `<label class="field" data-field="contacts-${n}"><span>${NETWORKS[n].icon} ${NETWORKS[n].label}</span>
      <input type="text" name="c_${n}" value="${esc(contacts[n] || "")}" autocomplete="off"><small>${esc(CONTACT_HINTS[n])}</small></label>`).join("")}</div>
    <div class="notice">⚠️ <b>WhatsApp</b> : le site ne connaît pas votre numéro, mais une fois la conversation ouverte, WhatsApp peut le montrer à la personne qui vous écrit. Pour rester 100 % pseudonyme, préférez Telegram ou Signal.</div>
  </form>

  <form class="panel" id="projects">
    <h2>Mes projets <span class="faint">(4 maximum)</span></h2>
    <p class="faint" style="margin-top:0">Présentez ce que vous avez construit en vibe coding.</p>
    <div id="proj-list">${user.projects.map(projectBlock).join("")}</div>
    <button class="btn" type="button" id="add-proj">＋ Ajouter un projet</button>
    <div class="proj bonus" style="margin-top:14px">⭐ <b>5ᵉ projet bonus</b> : réservé aux projets labellisés « Créé ici », réalisés en équipe sur la plateforme. Bientôt disponible.</div>
  </form>

  <div class="save-bar"><button class="btn btn-primary" id="save">💾 Enregistrer</button></div>

  ${user.isAdmin ? `<div class="panel" id="admin"><h2>🛡️ Modération</h2><div id="reports" class="muted">Chargement…</div></div>` : ""}

  <div class="panel">
    <h2>Mon compte</h2>
    <p class="faint" style="margin-top:0">Identifiant membre : <span class="code">${esc(user.code)}</span>. Nous ne stockons ni votre email, ni votre nom.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <form method="post" action="/auth/logout"><button class="btn">Se déconnecter</button></form>
      <button class="btn btn-danger" id="delete">Supprimer mon compte</button>
    </div>
  </div>`;

  const projList = $("#proj-list");
  const refreshAdd = () => { $("#add-proj").disabled = projList.children.length >= 4; };
  const reindex = () => [...projList.children].forEach((el, i) => {
    el.querySelector("strong").textContent = `Projet ${i + 1}`;
    el.querySelectorAll("[data-field]").forEach((f) => f.dataset.field = f.dataset.field.replace(/projects-\d+/, `projects-${i}`));
  });
  refreshAdd();

  $("#specs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-spec]"); if (!b) return;
    const on = b.getAttribute("aria-pressed") !== "true";
    if (on && $("#specs").querySelectorAll('[aria-pressed="true"]').length >= 5) return toast("5 spécialités maximum");
    b.setAttribute("aria-pressed", on);
  });
  $("#add-proj").addEventListener("click", () => {
    if (projList.children.length >= 4) return;
    projList.insertAdjacentHTML("beforeend", projectBlock({}, projList.children.length));
    refreshAdd();
    projList.lastElementChild.querySelector("input").focus();
  });
  projList.addEventListener("click", (e) => {
    const block = e.target.closest("[data-proj]");
    if (e.target.closest("[data-remove]")) { block.remove(); reindex(); refreshAdd(); }
    if (e.target.closest("[data-up]") && block.previousElementSibling) { block.parentNode.insertBefore(block, block.previousElementSibling); reindex(); }
    const t = e.target.closest("[data-tool]");
    if (t) {
      const on = t.getAttribute("aria-pressed") !== "true";
      if (on && block.querySelectorAll('[data-tool][aria-pressed="true"]').length >= 8) return toast("8 outils maximum par projet");
      t.setAttribute("aria-pressed", on);
    }
  });

  $("#save").addEventListener("click", async () => {
    const f = $("#profile");
    const profile = {
      pseudo: f.pseudo.value,
      bio: f.bio.value,
      specialties: [...$("#specs").querySelectorAll('[aria-pressed="true"]')].map((b) => b.dataset.spec),
      available: f.available.checked,
      avatarMode: f.githubAvatar.checked ? "github" : "generated",
      contacts: Object.fromEntries(options.networks.map((n) => [n, f[`c_${n}`].value])),
    };
    const projects = [...projList.children].map((el) => ({
      title: el.querySelector('[name="title"]').value,
      pitch: el.querySelector('[name="pitch"]').value,
      github_url: el.querySelector('[name="github_url"]').value,
      demo_url: el.querySelector('[name="demo_url"]').value,
      tools: [...el.querySelectorAll('[data-tool][aria-pressed="true"]')].map((b) => b.dataset.tool),
    }));
    try {
      await api("/api/me/profile", { method: "PUT", body: profile });
    } catch (err) { return showError($("#profile"), err); }
    try {
      await api("/api/me/projects", { method: "PUT", body: { projects } });
    } catch (err) { return showError($("#projects"), err); }
    toast("Fiche enregistrée ✅");
    setTimeout(() => location.reload(), 700);
  });

  $("#delete").addEventListener("click", async () => {
    if (!confirm("Supprimer définitivement votre compte, votre fiche, vos projets et vos recommandations ? Cette action est irréversible.")) return;
    try {
      await api("/api/me/delete", { method: "POST" });
      location.href = "/outils";
    } catch (err) { toast(err.message); }
  });

  if (user.isAdmin) loadReports();
}

// ───────── Modération (admin) ─────────
async function loadReports() {
  const box = $("#reports");
  try {
    const { reports } = await api("/api/admin/reports");
    if (!reports.length) { box.textContent = "Aucun signalement 🎉"; return; }
    box.innerHTML = `<table><thead><tr><th>Membre signalé</th><th>Raison</th><th>Par</th><th></th></tr></thead><tbody>${reports.map((r) => `<tr>
      <td><a href="/showroom#${esc(r.target_code)}">${esc(r.target_pseudo || "—")}</a><br><span class="code">${esc(r.target_code)}</span>${r.target_hidden ? '<br><span class="tag">masqué</span>' : ""}</td>
      <td>${esc(r.reason)}<br><span class="faint">${new Date(r.created_at).toLocaleString("fr-FR")} · ${r.status === "open" ? "ouvert" : "traité"}</span></td>
      <td>${esc(r.reporter_pseudo || "—")}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-sm" data-hide="${esc(r.target_code)}" data-v="${!r.target_hidden}">${r.target_hidden ? "Réafficher" : "Masquer"}</button>
        <button class="btn btn-sm" data-close="${r.id}" data-v="${r.status === "open" ? "closed" : "open"}">${r.status === "open" ? "Clore" : "Rouvrir"}</button></td></tr>`).join("")}</tbody></table>`;
  } catch (err) { box.textContent = err.message; }
}
document.addEventListener("click", async (e) => {
  const h = e.target.closest("[data-hide]"), c = e.target.closest("[data-close]");
  if (!h && !c) return;
  try {
    await api("/api/admin/moderate", { method: "POST", body: h ? { code: h.dataset.hide, hidden: h.dataset.v === "true" } : { reportId: c.dataset.close, status: c.dataset.v } });
    loadReports();
  } catch (err) { toast(err.message); }
});

// ───────── Démarrage ─────────
const { user, options } = await loadMe();
if (!user) renderLogin();
else if (user.needsOnboarding) renderOnboarding(user);
else renderProfile(user, options);
</script>
</body>
</html>
