<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=localStorage.getItem("vt-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Conditions d'utilisation</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<style>
main { max-width: 760px; margin: 40px auto 0; padding: 0 16px; }
#doc h1 { font-size: clamp(28px, 5vw, 40px); text-align: left; margin: 0 0 12px; }
#doc h2 { margin-top: 32px; font-size: 22px; }
#doc h3 { margin-top: 22px; }
#doc p, #doc li { color: var(--muted); }
#doc strong { color: var(--text); }
#doc blockquote { margin: 16px 0; padding: 10px 14px; border-radius: 12px; background: color-mix(in srgb, var(--warn) 10%, transparent); border-left: 3px solid var(--warn); }
#doc blockquote p { margin: 0; color: var(--text); }
#doc table { width: 100%; border-collapse: collapse; font-size: 14px; display: block; overflow-x: auto; }
#doc th, #doc td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; }
#doc hr { border: 0; border-top: 1px solid var(--border); margin: 28px 0; }
#doc code { font-family: "JetBrains Mono", monospace; font-size: .9em; }
</style>
</head>
<body data-doc="cgu">
<div class="aurora" aria-hidden="true"></div>
<main><article class="panel" id="doc"><p class="muted">Chargement…</p></article></main>
<script type="module" src="/assets/legal.js"></script>
</body>
</html>
